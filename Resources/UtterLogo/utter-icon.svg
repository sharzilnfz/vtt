<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Squircle Canvas (macOS / Developer App Icon) -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="510" height="510" x="1" y="1" rx="114" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2"/>

  <!-- Subtle Acoustic Ambient Glow -->
  <circle cx="256" cy="256" r="200" fill="url(#glowGrad)"/>

  <!-- Geometric U Vessel (Utter Boundary) -->
  <path d="M 143 148 L 143 258 A 113 113 0 0 0 369 258 L 369 148"
        fill="none"
        stroke="#F8FAFC"
        stroke-width="26"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Inner Voice Waveform Core (3 Audio Resonance Bars) -->
  <!-- Left Bar -->
  <rect x="216" y="234" width="18" height="48" rx="9" fill="#38BDF8"/>
  <!-- Center Bar (Tallest / Primary Resonance) -->
  <rect x="247" y="213" width="18" height="90" rx="9" fill="#FFFFFF"/>
  <!-- Right Bar -->
  <rect x="278" y="234" width="18" height="48" rx="9" fill="#38BDF8"/>
</svg>
