<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="100%" height="100%">
  <defs>
    <linearGradient id="markBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F4F5"/>
    </linearGradient>
    <radialGradient id="markGlowLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas -->
  <rect width="720" height="200" rx="20" fill="#F8FAFC"/>
  <rect width="718" height="198" x="1" y="1" rx="19" fill="none" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Icon Mark -->
  <g transform="translate(44, 40)">
    <rect width="120" height="120" rx="27" fill="url(#markBgLight)"/>
    <rect width="118" height="118" x="1" y="1" rx="26" fill="none" stroke="#000000" stroke-opacity="0.08" stroke-width="1"/>
    <circle cx="60" cy="60" r="48" fill="url(#markGlowLight)"/>

    <!-- U Vessel -->
    <path d="M 33.5 35 L 33.5 60.5 A 26.5 26.5 0 0 0 86.5 60.5 L 86.5 35"
          fill="none"
          stroke="#09090B"
          stroke-width="6.2"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- 3 Waveform Bars -->
    <rect x="50.5" y="55" width="4.5" height="11.5" rx="2.25" fill="#0284C7"/>
    <rect x="57.75" y="50" width="4.5" height="21.5" rx="2.25" fill="#09090B"/>
    <rect x="65" y="55" width="4.5" height="11.5" rx="2.25" fill="#0284C7"/>
  </g>

  <!-- Wordmark: "utter." -->
  <text x="194" y="116"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif"
        font-size="64"
        font-weight="800"
        letter-spacing="-2.5"
        fill="#09090B">utter<tspan fill="#0284C7">.</tspan></text>

  <!-- Tagline / Subtitle -->
  <text x="196" y="146"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', 'Menlo', monospace"
        font-size="12"
        font-weight="600"
        letter-spacing="2"
        fill="#64748B">MINIMAL ON-DEVICE SPEECH INTELLIGENCE</text>
</svg>
